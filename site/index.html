    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('visual-prompts-theme') || 'dark';
      } catch { document.documentElement.dataset.theme = 'dark'; }
      const filters = new URLSearchParams(location.search);
      if (filters.has('kind') || filters.has('category') || filters.has('search') || filters.has('tag')) {
        document.documentElement.dataset.filtered = 'true';
      }
      if (document.documentElement.dataset.theme === 'light') {
        document.querySelector('meta[name="theme-color"]').content = '#f6f6f5';
      }
    </script>
